<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff sign in | Clinic</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f9; color: #1f2933; font: 16px/1.5 Georgia, 'Times New Roman', serif; }
        main { width: min(420px, calc(100% - 32px)); background: white; border: 1px solid #d9e2ec; border-radius: 8px; padding: 30px; box-shadow: 0 8px 24px rgba(15, 60, 64, .08); }
        h1 { margin-top: 0; color: #123c40; } label { display: block; font-weight: 700; margin: 16px 0 6px; } input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #b8c5d0; border-radius: 5px; font: inherit; } button { margin-top: 22px; width: 100%; padding: 11px; border: 0; border-radius: 5px; background: #0f766e; color: white; font: 700 1rem inherit; cursor: pointer; } .error { border-left: 4px solid #b42318; background: #fff0ef; padding: 10px 12px; }
    </style>
</head>
<body><main><h1>Staff sign in</h1><p>Sign in to access clinic records.</p>{% for message in messages %}<p class="error">{{ message }}</p>{% endfor %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></main></body>
</html>
